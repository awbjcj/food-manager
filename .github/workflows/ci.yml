name: CI/CD

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "true"
  UV_NO_PROGRESS: "true"
  TELEGRAM_BOT_TOKEN: ci-placeholder
  ALLOWED_TELEGRAM_USER_ID: "1"
  ANTHROPIC_API_KEY: ci-placeholder

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --all-groups

      - name: Lint
        run: uv run ruff check app tests bin migrations

      - name: Type check
        run: uv run pyright app bin

      - name: Verify migrations from an empty database
        run: uv run alembic upgrade head
        env:
          DATABASE_PATH: ${{ runner.temp }}/migration-smoke.db

      - name: Run tests
        run: uv run pytest -q

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build Python package
        run: uv build

      - name: Build production container
        run: docker build --tag "$IMAGE_TAG" .
        env:
          IMAGE_TAG: food-manager:${{ github.sha }}

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --all-groups

      - name: Export locked runtime dependencies
        run: >-
          uv export --no-dev --no-emit-project --no-hashes
          --output-file "$AUDIT_REQUIREMENTS"
        env:
          AUDIT_REQUIREMENTS: ${{ runner.temp }}/requirements-audit.txt

      - name: Audit locked runtime dependencies
        run: >-
          uv run pip-audit
          --requirement "$AUDIT_REQUIREMENTS"
          --strict --progress-spinner off
        env:
          AUDIT_REQUIREMENTS: ${{ runner.temp }}/requirements-audit.txt
