name: Sync dev with master

# Merges into master use "Rebase and merge", which rewrites commit SHAs. That
# leaves dev holding the same tree as master under different commit ids. This
# job replays dev onto master so the two branches stay identical: commits that
# already landed on master drop out via patch-id, and any genuinely new dev
# work is preserved on top.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-dev-with-master
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  UV_NO_PROGRESS: "true"
  TELEGRAM_BOT_TOKEN: ci-placeholder
  ALLOWED_TELEGRAM_USER_ID: "1"
  ANTHROPIC_API_KEY: ci-placeholder

jobs:
  sync:
    name: Rebase dev onto master
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
          # Credentials are kept on purpose: this job pushes the synced dev.
          persist-credentials: true

      - name: Rebase dev onto master
        id: rebase
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet origin master dev

          before="$(git rev-parse origin/dev)"
          git checkout --quiet -B dev "$before"

          if git merge-base --is-ancestor origin/master dev; then
            echo "dev already contains master ($(git rev-parse --short origin/master)); nothing to do."
            exit 0
          fi

          if ! git rebase origin/master; then
            git rebase --abort || true
            echo "::error::dev could not be rebased onto master automatically." \
                 "Resolve by hand: git fetch origin && git rebase origin/master dev && git push --force-with-lease origin dev"
            exit 1
          fi

          after="$(git rev-parse HEAD)"
          if [ "$after" = "$before" ]; then
            echo "dev unchanged after rebase; nothing to push."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "before=${before}" >> "$GITHUB_OUTPUT"
          echo "after=${after}" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        if: steps.rebase.outputs.changed == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.16"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Validate the rebased tree
        if: steps.rebase.outputs.changed == 'true'
        run: |
          set -euo pipefail
          uv sync --all-groups
          uv run ruff check app tests bin migrations
          uv run pytest -q

      - name: Publish validated dev
        if: steps.rebase.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.rebase.outputs.before }}
          AFTER: ${{ steps.rebase.outputs.after }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AFTER"
          git diff --quiet
          git diff --cached --quiet
          git push --force-with-lease="refs/heads/dev:${BEFORE}" origin HEAD:refs/heads/dev

      - name: Report result
        if: always()
        run: |
          git fetch --quiet origin master dev
          echo "master: $(git rev-parse --short origin/master)"
          echo "dev:    $(git rev-parse --short origin/dev)"
          if git merge-base --is-ancestor origin/master origin/dev; then
            echo "dev contains master."
          else
            echo "::warning::dev does NOT contain master; branches are still out of sync."
          fi
