[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "food-manager"
version = "0.1.0"
description = "Single-user grocery pantry + expiry-reminder Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.10,<4.0",
    "anthropic>=0.39,<1.0",
    "openai>=2.11,<3.0",
    "apscheduler>=3.10,<4.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
managed = true
