[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "food-manager"
version = "0.1.0"
description = "Single-user grocery pantry + expiry-reminder Telegram bot"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.0,<4.0",
    "aiogram>=3.30.0,<4.0",
    "anthropic>=0.120.0,<2.0",
    "openai>=2.48.0,<3.0",
    "google-genai>=2.14.0,<3.0",
    "apscheduler>=3.11.3,<4.0",
    "alembic>=1.18.5,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.14.2,<3.0",
    "sqlmodel>=0.0.39",
    "httpx>=0.28.1",
    "agno>=2.8.5",
]

[project.urls]
Repository = "https://github.com/awbjcj/food-manager"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "freezegun>=1.5",
    "ruff>=0.16.0",
    "pyright>=1.1.411",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
managed = true
